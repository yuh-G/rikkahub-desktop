<!doctype html>
<!--
  Tauri 壳启动页(仅桌面安装形态使用,src-tauri/tauri.conf.json 的 window.url 指向它)。
  为什么存在:窗口创建即开始加载,而后端 sidecar 要晚数百毫秒~数秒才绑定端口——
  初始 URL 若直指 http://localhost:8080,这段空窗里用户看到的是 WebView2 的
  「无法访问此页面 / ERR_CONNECTION_REFUSED」。本页是内嵌本地资源,零网络依赖,
  永远画得出来;后端就绪后由壳(lib.rs 的端口标记守卫)eval 重导航到真实端口。
  双生子约束:视觉必须与 app/root.tsx 的 HydrateFallback(SPA 启动屏)逐像素一致——
  版式/色值/字号/动画任一处改动,两边同步改,否则两页接力时会出现可见跳变。
  已知取舍:明暗只能跟 prefers-color-scheme(本页 origin 是 tauri.localhost,读不到
  localhost:8080 的 localStorage 预绘制键);显式暗色+浅色系统的用户会在接力瞬间
  看到一帧浅色——仍优于此前的整屏报错页。
  严禁在本页设置 window.__RIKKAHUB_APP__:那是壳判断「SPA 已就位、无需重导航」的旗标。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RikkaHub</title>
<style>
html,body{margin:0;height:100%;background:oklch(.992 .002 240)}
#rikkahub-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;background:oklch(.992 .002 240);color:oklch(.18 .005 240)}
#rikkahub-splash .sp-brand{display:flex;align-items:center;gap:16px;transform:translateY(-6%)}
#rikkahub-splash .sp-brand svg{width:38px;height:54px}
#rikkahub-splash .sp-brand span{font:650 48px/1 system-ui,"Segoe UI",-apple-system,sans-serif;letter-spacing:-.02em}
#rikkahub-splash .sp-dots{display:flex;gap:7px}
#rikkahub-splash .sp-dots i{width:9px;height:9px;border-radius:9999px;background:oklch(.55 .01 240);animation:rikkahub-splash-bounce 1s infinite}
@keyframes rikkahub-splash-bounce{0%,100%{transform:translateY(-30%);animation-timing-function:cubic-bezier(.8,0,1,1)}50%{transform:none;animation-timing-function:cubic-bezier(0,0,.2,1)}}
@media (prefers-color-scheme:dark){
html,body{background:oklch(.12 .006 240)}
#rikkahub-splash{background:oklch(.12 .006 240);color:oklch(.93 .006 240)}
#rikkahub-splash .sp-dots i{background:oklch(.65 .01 240)}
}
</style>
</head>
<body>
<div id="rikkahub-splash">
  <div class="sp-brand">

    <span>RikkaHub</span>
