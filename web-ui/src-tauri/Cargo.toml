[package]
name = "rikkahub"
version = "1.5.0"
description = "Rikkahub — a native Windows LLM chat client."
authors = ["yuh-G"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "rikkahub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
# 专题8:窗口尺寸/位置/最大化状态的记忆(官方插件,自动多屏/DPI 处理)。
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lightweight locale detection (~3 KB) — used to render the tray menu in the
# user's system language instead of hard-coding Chinese.
sys-locale = "0.3"
# issue12:托盘图标按 DPI 精确缩放。系统托盘在 150%/125% 等缩放下需要 24/20px 图标,
# 之前直接喂 32px 由 Windows 拉伸导致模糊;现在运行时从 256px 源图 Lanczos 缩放到精确尺寸。
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
# 不能用 panic = "abort":build_tray 依赖 catch_unwind 把 Linux 缺 appindicator 库时的
# dlopen panic 降级为"无托盘运行"(见 lib.rs)。abort 策略下 catch_unwind 是空操作,
# 精简桌面/容器桌面上应用会整个崩溃。unwind 对 GUI 应用也更好:辅助线程 panic 只死线程。
codegen-units = 1
lto = true
opt-level = "s"
strip = true
