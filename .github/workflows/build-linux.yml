name: Build Linux Binary

# 产出 Linux x64 可直接运行的 tar.gz 包(二进制 + 前端资源 + mupdf wasm 嵌入)。
# 前端资源由 routeStatic 在运行时从 exe 同目录的 web-ui/build/client 读取,
# 不是嵌入二进制的,所以发布包必须把两者一起打包,否则用户解压单文件二进制后
# 打开页面只会看到 "web-ui is not built"。
#
# 后端 update/check 按 *_linux_x64.tar.gz 命名约定匹配这个 asset,文件名不能改。
#
# 两种触发:
#   - tag 推送(v*.*.*):打包并自动附加到对应版本的 Release
#   - 手动触发(workflow_dispatch):只产出 artifact,从 Actions 页下载后手动上传到 Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(用于产物文件名,例如 1.1.0)'
        required: true
        default: '1.1.0'
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # tag 触发时附加资产到 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      # pi/ 是 gitignore 的本地浅克隆(vendored 源码),不进仓库。pc-server 直接
      # import 其 TS 源码,缺它 bun build --compile 第一步解析 import 即失败。
      # 按 CLAUDE.md「pi vendor 维护手册」重建:浅克隆上游基线 + 应用 pi-patches/*.patch。
      # 装 pi 自己的依赖(proper-lockfile/typebox/openai 等,bun build 会把它们
      # 一并打包;缺了 bun build 报 Could not resolve)。pi 的 bun.lock 是
      # lockfileVersion 1,Bun 1.4.0 会迁移它,故不能用 --frozen-lockfile。
      # packages/ai/src/providers/data/ 是构建期生成物、git 不跟踪。模型数据走
      # pi-model-data/ 快照(host 仓库 tracked,与下方 pin 的基线严格配对)——不跑
      # generate-models:它先删全部 *.models.ts 分片再按 models.dev 当天状态重建,
      # 第三方数据漂移(2026-09-21 kimi-for-coding 被摘除)会让分片删后无人重建,
      # bun build --compile 解析 import 即失败(当日 v3 发版 Linux 构建正是这么挂的)。
      - name: Restore pi vendor
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/earendil-works/pi.git pi
          cd pi
          git checkout d981de1229ef899957bbe968bc8dcda02a21f477
          git reset --hard
          git apply ../pi-patches/*.patch
          bun install
          mkdir -p packages/ai/src/providers/data
          cp ../pi-model-data/*.json ../pi-model-data/.manifest.json packages/ai/src/providers/data/

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # tag 触发:从 v1.1.0 这样的 ref name 去掉前导 v
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # ── 构建前端 SPA ──────────────────────────────────────────────────────
      # Bun 1.4.0 起 react-dom 的 bun 条件导出不再阻断 React Router 的 SSR build
      # 步骤(缺 renderToPipeableStream 的旧软链 workaround 已删,实测两种形态全绿)。
      - name: Build web-ui
        working-directory: web-ui
        run: |
          bun install --frozen-lockfile
          bun run build

      # ── 编译后端二进制 ────────────────────────────────────────────────────
      # mupdf 的 wasm 必须先存在于 node_modules,bun --compile 才能把它作为 asset 嵌入单文件二进制。
      - name: Compile Linux x64 binary
        working-directory: pc-server
        run: |
          bun install --frozen-lockfile
          mkdir -p /tmp/pkg/rikkahub-pc/web-ui/build
          bun build --compile --target=bun-linux-x64 server.ts --outfile /tmp/pkg/rikkahub-pc/rikkahub-pc
          chmod +x /tmp/pkg/rikkahub-pc/rikkahub-pc

      # ── 组装可运行目录并打包 tar.gz ──────────────────────────────────────
      # 解压后得到一个自包含的 rikkahub-pc/ 目录:二进制 + 前端。
      # 用户解压后直接 ./rikkahub-pc 即可运行(tar 保留了 +x 权限位)。
      - name: Assemble package
        run: |
          cp -r web-ui/build/client /tmp/pkg/rikkahub-pc/web-ui/build/client
          # 内置字体(若有)随包分发;目录可能只有 README,空拷贝无副作用。
          cp -r fonts /tmp/pkg/rikkahub-pc/fonts
          # 8-5:品牌图标随包分发,否则全部降级为灰底首字母
          cp -r icons /tmp/pkg/rikkahub-pc/icons
          # sanity:确认 index.html 在位,否则 routeStatic 会回退到 "not built" 提示
          test -f /tmp/pkg/rikkahub-pc/web-ui/build/client/index.html
          cd /tmp/pkg
          tar czf "/tmp/Rikkahub_${{ steps.ver.outputs.version }}_linux_x64.tar.gz" rikkahub-pc/
          ls -lh "/tmp/Rikkahub_${{ steps.ver.outputs.version }}_linux_x64.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Rikkahub_${{ steps.ver.outputs.version }}_linux_x64
          path: /tmp/Rikkahub_${{ steps.ver.outputs.version }}_linux_x64.tar.gz
          retention-days: 30

      # tag 触发时自动附加到对应版本的 GitHub Release;手动触发只产出 artifact 供下载。
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/Rikkahub_${{ steps.ver.outputs.version }}_linux_x64.tar.gz
