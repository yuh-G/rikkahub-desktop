name: Build Linux Binary

# 产出 Linux x64 的 Tauri 桌面版 tar.gz 包(与 Windows 的 NSIS 安装器对应):
#   壳 rikkahub(Rust/Tauri,原生窗口 + 自定义标题栏)+ sidecar rikkahub-server(Bun 编译)
#   + 前端资源 web-ui/build/client + fonts + icons,全部放在 rikkahub-app/ 同一目录,
#   sidecar 的 routeStatic 在运行时从自身同目录读取前端(不嵌入二进制)。
# 不使用 deb/rpm/appimage bundle:那些格式把资源放到 usr/lib/<product>/,而 sidecar 约定
# 从自身同目录找 web-ui,打包格式会直接 404。官方 Linux 产物保持便携目录 + tar.gz。
#
# 后端 update/check 按 *_linux_x64.tar.gz 命名约定匹配这个 asset,文件名不能改。
#
# 两种触发:
#   - tag 推送(v*.*.*):打包并自动附加到对应版本的 Release
#   - 手动触发(workflow_dispatch):只产出 artifact,从 Actions 页下载后手动上传到 Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(用于产物文件名,例如 1.1.0)'
        required: true
        default: '1.1.0'
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # tag 触发时附加资产到 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 与本地开发环境保持一致;升级 Bun 时记得同步,避免编译产物行为漂移。
          bun-version: '1.3.13'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # tag 触发:从 v1.1.0 这样的 ref name 去掉前导 v
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # ── 构建前端 SPA ──────────────────────────────────────────────────────
      # react-router build 在 SPA 模式下仍会引用 react-dom/server,而 Bun 自带的
      # react-dom/server.bun.js 缺少 renderToPipeableStream,会导致 build 报错。
      # 用 Node 版的 server bundle 替换它(Dockerfile 里也是同样处理)。
      # 这里先 build 一次供组装步骤使用;tauri build 的 beforeBuildCommand 会再跑一次。
      - name: Build web-ui
        working-directory: web-ui
        run: |
          bun install --frozen-lockfile
          rm -f node_modules/react-dom/server.bun.js
          ln -sf server.node.js node_modules/react-dom/server.bun.js
          rm -f node_modules/react-dom/cjs/react-dom-server.bun.development.js
          ln -sf react-dom-server.node.development.js node_modules/react-dom/cjs/react-dom-server.bun.development.js
          rm -f node_modules/react-dom/cjs/react-dom-server.bun.production.js
          ln -sf react-dom-server.node.production.js node_modules/react-dom/cjs/react-dom-server.bun.production.js
          bun run build

      # ── 编译 sidecar + Tauri 壳 ──────────────────────────────────────────
      # tauri:build:linux = 先 bun --compile sidecar 到 binaries/(mupdf wasm 由 pc-server
      # 的 bun install 提供)→ 再 tauri build --no-bundle。tauri-build 按目标三元组找
      # binaries/rikkahub-server-<triple> 拷到 target/release/,运行时 sidecar 从壳同目录
      # 解析。--no-bundle:Linux 官方产物是便携目录(见工作流顶部注释),不生成 deb/rpm/appimage。
      - name: Build Tauri shell
        working-directory: web-ui
        run: bun run tauri:build:linux

      # ── 组装便携目录并打包 tar.gz ─────────────────────────────────────────
      # 解压后得到自包含的 rikkahub-app/ 目录:壳 + sidecar + 前端 + 字体 + 图标。
      # 用户解压后直接 ./rikkahub-app/rikkahub 即可运行(tar 保留了 +x 权限位)。
      - name: Assemble package
        run: |
          RELEASE_DIR=dist
          APP_DIR="$RELEASE_DIR/rikkahub-app"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/web-ui/build"
          cp web-ui/src-tauri/target/release/rikkahub "$APP_DIR/rikkahub"
          cp web-ui/src-tauri/target/release/rikkahub-server "$APP_DIR/rikkahub-server"
          cp -r web-ui/build/client "$APP_DIR/web-ui/build/client"
          cp -r fonts "$APP_DIR/fonts"
          cp -r icons "$APP_DIR/icons"
          chmod +x "$APP_DIR/rikkahub" "$APP_DIR/rikkahub-server"
          # sanity:确认 index.html 在位,否则 routeStatic 会回退到 "not built" 提示
          test -f "$APP_DIR/web-ui/build/client/index.html"
          tar czf "/tmp/Rikkahub_${{ steps.ver.outputs.version }}_linux_x64.tar.gz" \
            -C "$RELEASE_DIR" rikkahub-app/
          ls -lh "/tmp/Rikkahub_${{ steps.ver.outputs.version }}_linux_x64.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Rikkahub_${{ steps.ver.outputs.version }}_linux_x64
          path: /tmp/Rikkahub_${{ steps.ver.outputs.version }}_linux_x64.tar.gz
          retention-days: 30

      # tag 触发时自动附加到对应版本的 GitHub Release;手动触发只产出 artifact 供下载。
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/Rikkahub_${{ steps.ver.outputs.version }}_linux_x64.tar.gz
